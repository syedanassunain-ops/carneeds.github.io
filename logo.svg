<svg width="400" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E31E24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B91419;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="120" fill="url(#redGradient)" rx="8"/>
  
  <!-- Car silhouette -->
  <g transform="translate(30, 35)">
    <path d="M5 30 L0 25 L5 20 L15 18 L20 15 L30 15 L35 18 L45 20 L50 25 L45 30 Z" 
          fill="white" opacity="0.9"/>
    <circle cx="15" cy="30" r="4" fill="white"/>
    <circle cx="35" cy="30" r="4" fill="white"/>
    <path d="M8 20 L12 15 L18 15 L22 20 Z" fill="white" opacity="0.8"/>
    <path d="M28 20 L32 15 L38 15 L42 20 Z" fill="white" opacity="0.8"/>
  </g>
  
  <!-- Main text: THE CAR NEEDS -->
  <text x="110" y="55" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" letter-spacing="2">
    THE CAR NEEDS
  </text>
  
  <!-- Tagline -->
  <text x="110" y="80" font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.9" letter-spacing="1">
    rebirth for your car
  </text>
  
  <!-- Decorative line -->
  <line x1="110" y1="68" x2="380" y2="68" stroke="white" stroke-width="1" opacity="0.5"/>
</svg>
